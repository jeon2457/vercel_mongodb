<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문자메시지 보내기</title>
    <!-- 부트스트랩 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* 모바일 환경 고려하여 테이블 영역 스크롤 추가 */
        .table-responsive {
            max-height: 350px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <h4 class="mb-3 text-center fw-bold">문자메시지 보내기</h4>
        
        <form>
            <div class="mb-3">
                <textarea class="form-control" id="messageContent" rows="4" placeholder="보내실 내용을 입력하세요."></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0 fw-bold">회원 목록</h6>
                <div>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="toggleAddMemberBtn">회원추가</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary ms-1" id="toggleEditMemberBtn">회원수정</button>
                </div>
            </div>

            <!-- 회원 추가/수정 폼 (기본 숨김) -->
            <div class="card mb-3 hidden" id="addMemberForm">
                <div class="card-body bg-light">
                    <div class="alert alert-info py-2 px-3 mb-2" style="font-size: 0.8rem;" role="alert">
                        ※ 이 코드는 HTML코드이므로 회원추가는 일회용으로 사용할 수 있으므로 참고바랍니다!
                    </div>
                    <div class="row g-2">
                        <div class="col-4">
                            <input type="text" class="form-control form-control-sm" id="newName" placeholder="이름" />
                        </div>
                        <div class="col-8">
                            <input type="text" class="form-control form-control-sm" id="newPhone" placeholder="휴대폰번호 입력" maxlength="13" />
                        </div>
                        <div class="col-12 mt-2 d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-success w-100" id="confirmAddBtn">확인 (추가)</button>
                            <button type="button" class="btn btn-sm btn-danger w-100 hidden" id="deleteMemberBtn">삭제</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 회원 목록 테이블 -->
            <div class="table-responsive border mb-3">
                <table class="table table-sm table-hover text-center mb-0 align-middle">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th style="width: 40px;">
                                <input class="form-check-input" type="checkbox" id="checkAll">
                            </th>
                            <th>이름</th>
                            <th>전화번호</th>
                        </tr>
                    </thead>
                    <tbody id="memberListBody">
                        <!-- JS를 통해 데이터 렌더링 됨 -->
                    </tbody>
                </table>
            </div>

            <button type="button" class="btn btn-primary w-100 py-2 mb-2" id="sendSmsBtn">선택된 회원에게 전송하기</button>
            <a href="index.html" class="btn btn-secondary w-100 py-2">돌아가기</a>
            
            <div class="text-end mt-2">
                <button type="button" class="btn btn-sm btn-outline-danger" id="resetDataBtn" style="font-size: 0.75rem;">초기 회원 데이터로 복구</button>
            </div>
        </form>
    </div>

    <script>
        let members = [];
        let editIndex = -1; // 수정 모드 시 인덱스 저장용 (-1은 추가 모드)

        const tbody = document.getElementById('memberListBody');
        const checkAll = document.getElementById('checkAll');
        const toggleAddBtn = document.getElementById('toggleAddMemberBtn');
        const toggleEditBtn = document.getElementById('toggleEditMemberBtn');
        const addForm = document.getElementById('addMemberForm');
        const nameInput = document.getElementById('newName');
        const phoneInput = document.getElementById('newPhone');
        const confirmBtn = document.getElementById('confirmAddBtn');
        const deleteBtn = document.getElementById('deleteMemberBtn');

        // 서버에서 데이터 불러오기
        async function fetchMembers() {
            try {
                const response = await fetch('/api/sms-members');
                if (!response.ok) throw new Error('서버 에러');
                members = await response.json();
                renderTable();
            } catch (error) {
                console.error('데이터를 불러오는데 실패했습니다:', error);
                alert('데이터를 불러오는데 실패했습니다.');
            }
        }

        // 1. 테이블 렌더링 함수
        function renderTable() {
            tbody.innerHTML = '';
            members.forEach((m, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <input class="form-check-input member-check" type="checkbox" value="${index}" id="chk_${index}">
                    </td>
                    <td><label class="form-check-label w-100" for="chk_${index}">${m.name}</label></td>
                    <td><label class="form-check-label w-100" for="chk_${index}">${m.phone}</label></td>
                `;
                tbody.appendChild(tr);
            });
            updateCheckAllState();
        }

        // 2. 전체 선택 / 해제
        checkAll.addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.member-check');
            checkboxes.forEach(chk => chk.checked = this.checked);
        });

        // 3. 개별 체크 시 전체선택 상태 변경
        tbody.addEventListener('change', function(e) {
            if (e.target.classList.contains('member-check')) {
                updateCheckAllState();
            }
        });

        function updateCheckAllState() {
            const checkboxes = document.querySelectorAll('.member-check');
            const checkedBoxes = document.querySelectorAll('.member-check:checked');
            checkAll.checked = (checkboxes.length > 0 && checkboxes.length === checkedBoxes.length);
        }

        // 4. 전화번호 자동 하이픈 기능 (-)
        phoneInput.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            let res = '';
            
            if (val.length < 4) {
                res = val;
            } else if (val.length < 8) {
                res = val.substr(0, 3) + '-' + val.substr(3);
            } else {
                res = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
            }
            this.value = res;
        });

        // 5. 회원추가 버튼 
        toggleAddBtn.addEventListener('click', () => {
            editIndex = -1;
            nameInput.value = '';
            phoneInput.value = '';
            confirmBtn.innerText = '확인 (추가)';
            confirmBtn.classList.replace('btn-warning', 'btn-success');
            deleteBtn.classList.add('hidden');
            
            addForm.classList.remove('hidden');
        });

        // 6. 회원수정 버튼
        toggleEditBtn.addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.member-check:checked');
            if (checkedBoxes.length !== 1) {
                alert("수정할 회원을 한 명만 체크해주세요.");
                return;
            }
            
            editIndex = parseInt(checkedBoxes[0].value);
            const m = members[editIndex];
            
            nameInput.value = m.name;
            phoneInput.value = m.phone;
            
            confirmBtn.innerText = '확인 (수정)';
            confirmBtn.classList.replace('btn-success', 'btn-warning');
            deleteBtn.classList.remove('hidden');
            
            addForm.classList.remove('hidden');
        });

        // 7. 삭제 버튼 클릭
        deleteBtn.addEventListener('click', async () => {
            if (editIndex > -1 && confirm("정말 삭제하시겠습니까?")) {
                const memberId = members[editIndex]._id;
                try {
                    const response = await fetch('/api/sms-members/' + memberId, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('삭제 실패');
                    
                    alert("삭제되었습니다.");
                    editIndex = -1;
                    addForm.classList.add('hidden');
                    fetchMembers(); // 다시 불러오기
                } catch (error) {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            }
        });

        // 8. 추가/수정 확인 버튼
        confirmBtn.addEventListener('click', async () => {
            const nameVal = nameInput.value.trim();
            const phoneVal = phoneInput.value.trim();

            if (!nameVal || !phoneVal) {
                alert("이름과 전화번호를 모두 입력해주세요.");
                return;
            }

            // 버튼 비활성화 (중복 클릭 방지)
            confirmBtn.disabled = true;
            confirmBtn.innerText = '저장 중...';

            try {
                if (editIndex === -1) {
                    // 추가 모드
                    const response = await fetch('/api/sms-members', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: nameVal, phone: phoneVal })
                    });
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || `서버 오류 (${response.status})`);
                    }
                    alert(nameVal + " 회원이 추가되었습니다.");
                } else {
                    // 수정 모드
                    const memberId = members[editIndex]._id;
                    const response = await fetch('/api/sms-members/' + memberId, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: nameVal, phone: phoneVal })
                    });
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || `서버 오류 (${response.status})`);
                    }
                    alert("회원 정보가 수정되었습니다.");
                    editIndex = -1;
                }

                // 폼 닫기 및 초기화
                nameInput.value = '';
                phoneInput.value = '';
                addForm.classList.add('hidden');
                deleteBtn.classList.add('hidden');

                // DB에서 최신 데이터 다시 불러오기
                await fetchMembers();

            } catch (error) {
                alert('저장 실패: ' + error.message);
            } finally {
                // 버튼 원상 복구
                confirmBtn.disabled = false;
                if (editIndex === -1) {
                    confirmBtn.innerText = '확인 (추가)';
                    confirmBtn.classList.replace('btn-warning', 'btn-success');
                } else {
                    confirmBtn.innerText = '확인 (수정)';
                }
            }
        });

        // 9. 전송하기 버튼 클릭 시 모바일 문자 앱 호출
        document.getElementById('sendSmsBtn').addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.member-check:checked');
            if (checkedBoxes.length === 0) {
                alert("문자를 보낼 회원을 선택해주세요.");
                return;
            }
            
            const msg = document.getElementById('messageContent').value;
            let phones = [];
            checkedBoxes.forEach(chk => {
                const idx = chk.value;
                const m = members[idx];
                phones.push(m.phone.replace(/-/g, ''));
            });

            const phoneStr = phones.join(',');
            const encodedMsg = encodeURIComponent(msg);
            
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            let smsLink = 'sms:' + phoneStr;
            if (msg) {
                smsLink += (isIOS ? '&' : '?') + 'body=' + encodedMsg;
            }
            
            window.location.href = smsLink;
        });

        // 10. 초기 데이터 복구
        document.getElementById('resetDataBtn').addEventListener('click', async () => {
            if (confirm("모든 변경사항이 지워지고 초기 상태로 복구됩니다. 계속하시겠습니까?")) {
                try {
                    const response = await fetch('/api/sms-members/reset', { method: 'POST' });
                    if (!response.ok) throw new Error('초기화 실패');
                    members = await response.json();
                    renderTable();
                    alert("초기화 되었습니다.");
                } catch (error) {
                    alert('초기화 중 오류가 발생했습니다.');
                }
            }
        });

        // 초기 로드 시 서버에서 데이터 가져오기
        fetchMembers();
    </script>
</body>
</html>
